# This project deliberately tracks @bastani/atomic releases the day they
# publish — the canary exists for exactly that window. pnpm 11's default
# release-age cooldown otherwise resolves @latest to an older version AND
# fails frozen-lockfile installs whose committed entries are younger than
# the cooldown (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION), so it is disabled
# repo-wide as committed policy. Same stance as the Atomic monorepo's npm
# min-release-age=0.
minimumReleaseAge: 0

allowBuilds:
  # embedded-postgres backs Atomic's optional DBOS durable backend; this
  # extension's suite never exercises it, so the postgres download/build is
  # denied on every platform (CI runs linux-x64; dev machines differ).
  '@embedded-postgres/darwin-arm64': false
  '@embedded-postgres/darwin-x64': false
  '@embedded-postgres/linux-arm64': false
  '@embedded-postgres/linux-x64': false
  '@embedded-postgres/windows-x64': false
  # esbuild (a dependency from atomic 0.9.18 on) ships its platform binary
  # through optional dependencies; its install script is only a validator.
  esbuild: false
  '@google/genai': false
  protobufjs: false
