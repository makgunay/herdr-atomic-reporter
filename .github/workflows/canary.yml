name: canary

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Atomic releases near-daily; check once a day.
    - cron: "17 6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  pinned:
    name: pinned atomic (regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Report atomic version under test
        run: node -p "'atomic ' + require('./node_modules/@bastani/atomic/package.json').version"
      - run: npm test

  latest:
    name: latest atomic (upstream drift canary)
    # Serialized after pinned so the drift-issue step can tell upstream drift
    # (pinned green, latest red) apart from a repo/CI regression (both red).
    needs: pinned
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Bump to latest atomic (CI-only, not committed)
        # pnpm 11 applies a default minimumReleaseAge cooldown that silently
        # resolves @latest to an older release while a fresh one is young —
        # exactly the window a drift canary exists to test. Disable it here
        # only; the pinned job keeps the frozen lockfile. strictDepBuilds is
        # also relaxed for this leg only, so a new upstream dependency with an
        # install script degrades to an ignored-build warning instead of an
        # infra failure that masquerades as drift (scripts stay unrun either
        # way; the pinned leg still enforces the committed allowBuilds list).
        run: pnpm add --save-exact @bastani/atomic@latest --config.minimumReleaseAge=0 --config.strictDepBuilds=false
      - name: Report atomic version under test
        id: version
        run: |
          v=$(node -p "require('./node_modules/@bastani/atomic/package.json').version")
          echo "atomic $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: npm test
      - name: Open drift issue on scheduled failure
        if: failure() && github.event_name == 'schedule' && needs.pinned.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          title="Drift: extension fails against @bastani/atomic@${VERSION:-latest}"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "The scheduled canary failed against the latest Atomic release while the pinned-version job passed in the same run — upstream drift, not a repo regression. See the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          fi
